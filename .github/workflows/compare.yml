name: Compare with the reference scanner

on:
  workflow_call:
    inputs:
      harness-ref:
        description: The commit of debar-clamav-harness to run. Pass the commit this workflow is pinned to.
        required: true
        type: string
      debar-repository:
        description: The repository holding the Debar under test. Defaults to the calling repository.
        required: false
        type: string
        default: ""
      debar-ref:
        description: The Debar commit or ref under test. Defaults to the commit that triggered the caller.
        required: false
        type: string
        default: ""
      build-command:
        description: Builds Debar, run with sh -c inside the Debar checkout.
        required: true
        type: string
      debar-command:
        description: >-
          Writes Debar's report of one input, run with sh -c from the directory holding the
          checkouts debar/ and harness/, with HARNESS_INPUT, HARNESS_REPORT and HARNESS_DATABASES set.
        required: true
        type: string
      inputs-directory:
        description: >-
          The files to scan, relative to the directory holding the checkouts. Defaults to the
          harness's own fixtures, built at run time.
        required: false
        type: string
        default: ""
      built-target:
        description: >-
          When set, scan the inputs the input builder makes from the buildable signatures of this
          target type (every extended signature by default; see extended-sample and
          logical-sample), and the boundary inputs below, instead of the fixtures, and count how
          many each scanner detected under the signature it was built for.
        required: false
        type: string
        default: ""
      boundary-sample:
        description: >-
          With built-target, how many of its signatures placed anywhere also get three inputs
          that put the built bytes across the file's first 128 KiB boundary.
        required: false
        type: string
        default: "2000"
      extended-sample:
        description: With built-target, how many of its extended signatures to build inputs from.
        required: false
        type: string
        default: "1000000"
      logical-sample:
        description: With built-target, how many of its logical signatures to build inputs from.
        required: false
        type: string
        default: "0"
      matching:
        description: >-
          every to scan with all-match, or first to stop each scan at its first strong
          detection, in the reference scanner as in HARNESS_MATCHING for the Debar command.
        required: false
        type: string
        default: every
      known-differences:
        description: The known differences to judge by, a path in the harness repository.
        required: false
        type: string
        default: known-differences.jsonl

permissions: {}

jobs:
  compare:
    name: compare (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mkhanal/debar-clamav-harness
          ref: ${{ inputs.harness-ref }}
          path: harness
          persist-credentials: false
      - name: Check out Debar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.debar-repository || github.repository }}
          ref: ${{ inputs.debar-ref || github.sha }}
          path: debar
          persist-credentials: false
      - name: Build Debar
        working-directory: debar
        run: sh -c "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
      - name: Build the fixtures
        if: inputs.inputs-directory == '' && inputs.built-target == ''
        run: harness/fixtures/build fixtures
      - name: Build inputs from the signatures
        if: inputs.built-target != ''
        run: harness/builder/build-inputs.sh built
        env:
          EXTENDED_SAMPLE: ${{ inputs.extended-sample }}
          LOGICAL_SAMPLE: ${{ inputs.logical-sample }}
          SAMPLE_TARGET: ${{ inputs.built-target }}
          BOUNDARY_SAMPLE: ${{ inputs.boundary-sample }}
      - name: Compare Debar with the reference scanner
        run: |
          if [ -n "$BUILT_TARGET" ]; then
            set -- --input built/sample/inputs --manifest built/sample/manifest.tsv
          else
            set -- --input "${INPUTS_DIRECTORY:-fixtures}"
          fi
          harness/run-harness run "$@" \
            --debar-command "$DEBAR_COMMAND" \
            --known-differences "harness/$KNOWN_DIFFERENCES" \
            --matching "$MATCHING" \
            --work-directory "$GITHUB_WORKSPACE/harness-work"
        env:
          INPUTS_DIRECTORY: ${{ inputs.inputs-directory }}
          BUILT_TARGET: ${{ inputs.built-target }}
          KNOWN_DIFFERENCES: ${{ inputs.known-differences }}
          MATCHING: ${{ inputs.matching }}
          DEBAR_COMMAND: ${{ inputs.debar-command }}
